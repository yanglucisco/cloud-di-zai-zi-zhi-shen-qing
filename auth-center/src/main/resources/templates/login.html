<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: #e8e8e8;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(10px);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h2 {
            color: #333;
            font-size: 28px;
            font-weight: 600;
            background: linear-gradient(45deg, #e73c7e, #23a6d5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }

        .input-group input:focus {
            outline: none;
            border-color: #23a6d5;
            background: white;
            box-shadow: 0 0 0 3px rgba(35, 166, 213, 0.1);
            transform: translateY(-2px);
        }

        .login-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #e73c7e, #23a6d5);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(35, 166, 213, 0.4);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .error-message {
            background: #fdecea;
            color: #d32f2f;
            border: 1px solid #f5c6c6;
            border-radius: 8px;
            padding: 10px 15px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }

        /* 响应式设计 */
        @media (max-width: 480px) {
            .login-container {
                margin: 20px;
                padding: 30px 20px;
            }
        }

        /* 暗黑模式适配 */
        @media (prefers-color-scheme: dark) {
            .login-container {
                background: rgba(30, 30, 30, 0.95);
            }
            
            .login-header h2 {
                color: #e0e0e0;
            }
            
            .input-group label {
                color: #ccc;
            }
            
            .input-group input {
                background: #2d2d2d;
                border-color: #444;
                color: #e0e0e0;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>用户登录</h2>
        </div>
        <div class="error-message" th:if="${error != null}" th:text="${error}"></div>
        <form id="loginForm" method="post" th:action="@{/login}">
            <!-- CSRF 隐藏域：/login 不在忽略列表中，缺少该域会被 CsrfFilter 拦截 -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="input-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" th:value="${username}" required>
            </div>
            <div class="input-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" th:value="${password}" required>
            </div>
            <div class="input-group">
                <label for="captcha">验证码</label>
                <input type="text" id="captcha" name="captcha" placeholder="请输入验证码" required maxlength="4" autocomplete="off">
                <img id="captchaImg" src="/captcha" alt="验证码" title="点击刷新" width="130" height="40"
                     style="cursor:pointer; border:1px solid #e0e0e0; border-radius:8px; vertical-align:middle; margin-top:8px;">
            </div>
            <button type="submit" class="login-button">登录</button>
        </form>
    </div>

    <script>
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const captchaInput = document.getElementById('captcha');
        const captchaImg = document.getElementById('captchaImg');

        // 自定义 HTML5 必填校验的中文提示
        usernameInput.addEventListener('invalid', function() {
            this.setCustomValidity('请输入用户名');
        });
        usernameInput.addEventListener('input', function() {
            this.setCustomValidity('');
        });

        passwordInput.addEventListener('invalid', function() {
            this.setCustomValidity('请输入密码');
        });
        passwordInput.addEventListener('input', function() {
            this.setCustomValidity('');
        });

        captchaInput.addEventListener('invalid', function() {
            this.setCustomValidity('请输入验证码');
        });
        captchaInput.addEventListener('input', function() {
            this.setCustomValidity('');
        });

        // 刷新验证码图片（带时间戳防止浏览器缓存旧图）
        function refreshCaptcha() {
            captchaImg.src = '/captcha?t=' + Date.now();
        }
        captchaImg.addEventListener('click', refreshCaptcha);
        document.addEventListener('DOMContentLoaded', refreshCaptcha);

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            // e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // 简单的表单验证
            if (username === '' || password === '') {
                alert('请输入用户名和密码');
                return;
            }
            
            // 模拟登录成功效果
            // const button = document.querySelector('.login-button');
            // button.textContent = '登录中...';
            // button.disabled = true;
            
            // setTimeout(() => {
            //     alert('登录成功！');
            //     button.textContent = '登录';
            //     button.disabled = false;
            // }, 1500);
        });
    </script>
</body>
</html>
