spring:
  application:
    name: auth-center
  thymeleaf:
    cache: false # 开发环境关闭模板缓存，修改模板无需重启即可生效
  cloud:
    nacos:
      server-addr: ${NACOS_HOST:127.0.0.1}:8848 #nacos配置中心地址，配置信息都从这里获取
      username: nacos
      password: ${NACOS_PASSWORD:nacos}
      group: DI_ZAI_ZI_ZHI_SHEN_QING
      file-extension: yml
  config:
    import:
      - optional:file:.env[.properties]
      - nacos:${spring.application.name}.${spring.cloud.nacos.file-extension}?group=${spring.cloud.nacos.group}